<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taiwan Satellite Tracker 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e27; color: #e0e0e0; overflow: hidden; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: linear-gradient(135deg, rgba(26,31,78,0.95), rgba(10,14,39,0.95));
      padding: 10px 16px;
      border-bottom: 1px solid #2a2f5e;
      backdrop-filter: blur(10px);
    }
    .header-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    header h1 { font-size: 1.1rem; color: #7eb8ff; white-space: nowrap; }
    header h1 span { font-size: 0.7rem; color: #888; margin-left: 4px; }

    .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: 1; }
    select, input[type="text"], button {
      padding: 5px 8px; border-radius: 6px; border: 1px solid #3a3f6e;
      background: #151a3e; color: #e0e0e0; font-size: 0.82rem;
    }
    input[type="text"] { width: 140px; }
    button { background: #2563eb; border-color: #2563eb; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .filter-row {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px;
    }
    .filter-row label { font-size: 0.75rem; color: #888; }
    .range-val { font-size: 0.75rem; color: #7eb8ff; min-width: 55px; }
    input[type="range"] { width: 90px; accent-color: #2563eb; background: transparent; border: none; padding: 0; }

    #globe { width: 100vw; height: 100vh; }

    .sidebar {
      position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 10;
      overflow-y: auto; padding: 16px; padding-top: 120px;
      background: rgba(15,19,51,0.95); border-left: 1px solid #2a2f5e;
      backdrop-filter: blur(10px);
      transition: transform 0.3s;
    }
    .sidebar.collapsed { transform: translateX(100%); }
    .sidebar-toggle {
      position: fixed; right: 340px; top: 130px; z-index: 11;
      background: #151a3e; border: 1px solid #3a3f6e; border-right: none;
      color: #7eb8ff; cursor: pointer; padding: 8px 4px; border-radius: 6px 0 0 6px;
      font-size: 1rem; transition: right 0.3s;
    }
    .sidebar-toggle.collapsed { right: 0; }

    .sidebar h2 { font-size: 0.95rem; color: #7eb8ff; margin-bottom: 8px; }
    .sat-card {
      background: #151a3e; border: 1px solid #2a2f5e; border-radius: 8px;
      padding: 9px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s;
    }
    .sat-card:hover { border-color: #2563eb; }
    .sat-card.active { border-color: #7eb8ff; background: #1a2050; }
    .sat-card .name { font-weight: 600; color: #fff; margin-bottom: 2px; font-size: 0.85rem; }
    .sat-card .meta { font-size: 0.72rem; color: #888; }

    .info-panel {
      background: #151a3e; border: 1px solid #2a2f5e; border-radius: 8px;
      padding: 10px; margin-bottom: 8px;
    }
    .info-panel h3 { font-size: 0.85rem; color: #7eb8ff; margin-bottom: 5px; }
    .info-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 0.8rem; }
    .info-row .label { color: #888; }
    .info-row .value { color: #fff; font-weight: 500; }

    .pass-item {
      background: #1a1f4e; border-radius: 6px; padding: 7px; margin-bottom: 5px; font-size: 0.75rem;
    }
    .pass-item .pass-time { color: #7eb8ff; font-weight: 600; margin-bottom: 2px; }
    .pass-item .pass-detail { color: #aaa; }

    .summary-section { margin-bottom: 8px; }
    .summary-section .summary-title {
      font-size: 0.82rem; color: #fff; font-weight: 600; margin-bottom: 4px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .summary-section .summary-title .count {
      font-size: 1rem; color: #7eb8ff;
    }
    .summary-country {
      display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.75rem;
      cursor: pointer; border-radius: 4px; padding-left: 4px; padding-right: 4px;
      transition: background 0.2s;
    }
    .summary-country:hover { background: rgba(37,99,235,0.15); }
    .summary-country .sc-label { color: #888; }
    .summary-country .sc-label .arrow { font-size: 0.6rem; margin-right: 3px; transition: transform 0.2s; display: inline-block; }
    .summary-country .sc-label .arrow.open { transform: rotate(90deg); }
    .summary-country .sc-val { color: #e0e0e0; font-weight: 500; }
    .summary-detail-list {
      display: none; padding: 2px 0 4px 14px; font-size: 0.68rem;
    }
    .summary-detail-list.open { display: block; }
    .summary-detail-item {
      display: flex; justify-content: space-between; padding: 1px 0; color: #aaa;
    }
    .summary-detail-item .sd-name { color: #7eb8ff; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .summary-detail-item .sd-passes { color: #e0e0e0; font-weight: 500; }
    .summary-divider { border: none; border-top: 1px solid #2a2f5e; margin: 6px 0; }

    .status-bar { font-size: 0.75rem; color: #666; padding: 3px 0; }
    .loading { color: #888; text-align: center; padding: 14px; }

    /* Satellite markers on globe */
    .sat-marker {
      font-size: 14px; text-align: center; line-height: 1;
      filter: drop-shadow(0 0 3px rgba(126,184,255,0.7));
      pointer-events: none;
    }
    .sat-marker.selected {
      font-size: 20px;
      filter: drop-shadow(0 0 8px rgba(0,255,136,0.9));
      animation: sat-pulse 1.5s ease-in-out infinite;
    }
    @keyframes sat-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    @media (max-width: 768px) {
      .sidebar { width: 100%; height: 40vh; top: auto; bottom: 0; padding-top: 10px;
        border-left: none; border-top: 1px solid #2a2f5e; }
      .sidebar.collapsed { transform: translateY(100%); }
      .sidebar-toggle { right: auto; left: 8px; bottom: 40vh; top: auto;
        border-radius: 6px 6px 0 0; border: 1px solid #3a3f6e; border-bottom: none; }
      .sidebar-toggle.collapsed { bottom: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Taiwan Satellite Tracker 3D <span>衛星追蹤器</span></h1>
    <div class="controls">
      <select id="sourceType">
        <option value="group">By Group</option>
        <option value="series">By Series</option>
      </select>
      <select id="groupSelect">
        <option value="stations">Space Stations</option>
        <option value="weather">Weather</option>
        <option value="starlink">Starlink</option>
        <option value="gps-ops">GPS</option>
        <option value="galileo">Galileo</option>
        <option value="active">All Active</option>
      </select>
      <select id="seriesSelect" style="display:none;">
        <optgroup label="🇨🇳 China">
          <option value="YAOGAN">遥感 YAOGAN (Remote Sensing)</option>
          <option value="GAOFEN">高分 GAOFEN (High Resolution)</option>
          <option value="BEIDOU">北斗 BEIDOU (Navigation)</option>
          <option value="FENGYUN">风云 FENGYUN (Weather)</option>
          <option value="TIANGONG">天宫 TIANGONG (Space Station)</option>
          <option value="SHENZHOU">神舟 SHENZHOU (Crewed)</option>
          <option value="TIANZHOU">天舟 TIANZHOU (Cargo)</option>
          <option value="ZHONGXING">中星 ZHONGXING (Comms)</option>
          <option value="SHIYAN">实验 SHIYAN (Experimental)</option>
          <option value="SHIJIAN">实践 SHIJIAN (Practice)</option>
          <option value="JILIN">吉林 JILIN (Commercial EO)</option>
          <option value="YUNHAI">云海 YUNHAI (Weather/Env)</option>
          <option value="HAIYANG">海洋 HAIYANG (Ocean)</option>
          <option value="TIANHUI">天绘 TIANHUI (Mapping)</option>
          <option value="HUANJING">环境 HUANJING (Disaster)</option>
          <option value="ZIYUAN">资源 ZIYUAN (Resources)</option>
          <option value="TIANTONG">天通 TIANTONG (Mobile Comms)</option>
          <option value="CHUANGXIN">创新 CHUANGXIN (Tech Demo)</option>
        </optgroup>
        <optgroup label="🇯🇵 Japan">
          <option value="HIMAWARI">ひまわり HIMAWARI (Weather)</option>
          <option value="MICHIBIKI">みちびき MICHIBIKI (Nav)</option>
          <option value="ALOS">ALOS (Earth Obs)</option>
        </optgroup>
        <optgroup label="🇺🇸 USA">
          <option value="GOES">GOES (Weather)</option>
          <option value="LANDSAT">Landsat (Earth Obs)</option>
          <option value="NOAA">NOAA (Weather)</option>
          <option value="TDRS">TDRS (Relay)</option>
        </optgroup>
        <optgroup label="🇮🇳 India">
          <option value="CARTOSAT">Cartosat (Earth Obs)</option>
          <option value="INSAT">INSAT (Comms)</option>
        </optgroup>
        <optgroup label="🇷🇺 Russia">
          <option value="COSMOS">Cosmos</option>
        </optgroup>
        <optgroup label="🌍 International">
          <option value="STARLINK">Starlink (Internet)</option>
          <option value="ONEWEB">OneWeb (Internet)</option>
          <option value="IRIDIUM">Iridium (Comms)</option>
        </optgroup>
      </select>
      <input type="text" id="searchInput" placeholder="Search name...">
      <button id="loadBtn">Load</button>
      <button id="trackBtn" disabled>Track</button>
      <button id="centerBtn" title="Center on tracked satellite" style="background:#1a1f4e;border-color:#3a3f6e;font-size:0.75rem;">Center</button>
      <button id="taiwanBtn" title="Center on Taiwan" style="background:#1a1f4e;border-color:#3a3f6e;font-size:0.75rem;">Taiwan</button>
      <a href="china.html" style="padding:5px 10px;border-radius:6px;background:#2a0f12;border:1px solid #ff5c5c;color:#ff8f8f;font-size:0.75rem;text-decoration:none;font-weight:600;">中國通過時間</a>
      <a href="showcase.html" style="padding:5px 10px;border-radius:6px;background:#0a1628;border:1px solid #2563eb;color:#7eb8ff;font-size:0.75rem;text-decoration:none;font-weight:600;">Showcase</a>
    </div>
  </div>
  <div class="filter-row">
    <label>Altitude:</label>
    <input type="range" id="altMin" min="0" max="2000" value="0" step="50">
    <span class="range-val" id="altMinVal">0 km</span>
    <span style="color:#555;">—</span>
    <input type="range" id="altMax" min="0" max="50000" value="50000" step="500">
    <span class="range-val" id="altMaxVal">50000 km</span>
    <button id="applyFilter" style="font-size:0.75rem;padding:3px 8px;">Apply</button>
  </div>
</header>

<div id="globe"></div>

<button class="sidebar-toggle" id="sidebarToggle">&laquo;</button>
<div class="sidebar" id="sidebar">
  <div id="positionPanel" class="info-panel" style="display:none;">
    <h3 id="satTitle">Satellite Position</h3>
    <div class="info-row"><span class="label">Latitude</span><span class="value" id="posLat">—</span></div>
    <div class="info-row"><span class="label">Longitude</span><span class="value" id="posLon">—</span></div>
    <div class="info-row"><span class="label">Altitude</span><span class="value" id="posAlt">—</span></div>
    <div class="info-row"><span class="label">Velocity</span><span class="value" id="posVel">—</span></div>
    <div class="info-row"><span class="label">Updated</span><span class="value" id="posTime">—</span></div>
  </div>
  <div id="passesPanel" style="display:none;">
    <h3>Upcoming Passes over Taiwan</h3>
    <div id="passesList"></div>
  </div>
  <div id="summaryPanel" class="info-panel">
    <h3>Passes over Taiwan</h3>
    <div id="summaryContent" class="loading">Loading summary...</div>
  </div>

  <h2>Satellites</h2>
  <div class="status-bar" id="statusBar">Select a source and click Load</div>
  <div id="satList"></div>
</div>

<div id="loadingOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#0a0e27;">
  <div style="text-align:center;color:#7eb8ff;">
    <div style="font-size:2rem;margin-bottom:12px;">🌍</div>
    <div id="loadingMsg">Loading 3D Globe...</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.45.1/dist/globe.gl.min.js"></script>
<script>
if (typeof Globe === 'undefined') {
  // Fallback to unpkg if jsdelivr fails
  document.write('<script src="https://unpkg.com/globe.gl@2.45.1/dist/globe.gl.min.js"><\/script>');
}
</script>
<script>
if (typeof Globe === 'undefined') {
  document.getElementById('loadingMsg').innerHTML = 'Globe.gl failed to load.<br>Try refreshing or clearing cache.';
}
</script>
<script>
(function() {
  var API_BASE = 'https://hash-generator-backend-ten.vercel.app';

  // --- DOM refs ---
  var sourceType = document.getElementById('sourceType');
  var groupSelect = document.getElementById('groupSelect');
  var seriesSelect = document.getElementById('seriesSelect');
  var searchInput = document.getElementById('searchInput');
  var loadBtn = document.getElementById('loadBtn');
  var trackBtn = document.getElementById('trackBtn');
  var satList = document.getElementById('satList');
  var statusBar = document.getElementById('statusBar');
  var positionPanel = document.getElementById('positionPanel');
  var passesPanel = document.getElementById('passesPanel');
  var sidebarToggle = document.getElementById('sidebarToggle');
  var sidebar = document.getElementById('sidebar');
  var altMin = document.getElementById('altMin');
  var altMax = document.getElementById('altMax');
  var altMinVal = document.getElementById('altMinVal');
  var altMaxVal = document.getElementById('altMaxVal');
  var applyFilter = document.getElementById('applyFilter');
  var centerBtn = document.getElementById('centerBtn');
  var taiwanBtn = document.getElementById('taiwanBtn');

  // --- GLOBE ---
  var taiwanLabel = [{ lat: 23.5, lng: 121, text: 'Taiwan 🇹🇼', color: '#ff6b6b', size: 1.5 }];

  if (typeof Globe === 'undefined') return;

  var globe = Globe()
    .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.45.1/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.45.1/example/img/earth-topology.png')
    .backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.45.1/example/img/night-sky.png')
    .atmosphereColor('#3a86ff')
    .atmosphereAltitude(0.15)
    .showGraticules(true)
    .pointOfView({ lat: 23.5, lng: 121, altitude: 2.5 })
    // Taiwan label
    .labelsData(taiwanLabel)
    .labelText('text')
    .labelColor('color')
    .labelSize('size')
    .labelDotRadius(0.5)
    .labelAltitude(0.01)
    // Satellite markers (HTML elements at orbital altitude)
    .htmlElementsData([])
    .htmlLat('lat')
    .htmlLng('lng')
    .htmlAltitude(function(d) { return d.alt / 6371; })
    .htmlElement(function(d) {
      var el = document.createElement('div');
      el.className = d.isSelected ? 'sat-marker selected' : 'sat-marker';
      el.textContent = '🛰️';
      el.title = d.name + ' (' + d.alt.toFixed(0) + ' km)';
      return el;
    })
    // Orbit paths
    .pathsData([])
    .pathPointLat(function(p) { return p[0]; })
    .pathPointLng(function(p) { return p[1]; })
    .pathColor(function() { return 'rgba(37,99,235,0.25)'; })
    .pathStroke(1.2)
    .pathDashLength(0.01)
    .pathDashGap(0.005)
    .pathDashAnimateTime(60000)
    // Rings for Taiwan
    .ringsData([{ lat: 23.5, lng: 121 }])
    .ringMaxRadius(3)
    .ringPropagationSpeed(1)
    .ringRepeatPeriod(1500)
    .ringColor(function() { return 'rgba(255,107,107,0.5)'; })
    (document.getElementById('globe'));

  // Hide loading overlay once globe renders
  setTimeout(function() {
    var overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.style.display = 'none';
  }, 2000);

  // Resize handler
  function onResize() {
    globe.width(window.innerWidth);
    globe.height(window.innerHeight);
  }
  window.addEventListener('resize', onResize);
  onResize();

  // --- Source type toggle ---
  function syncSourceType() {
    var isSeries = sourceType.value === 'series';
    groupSelect.style.display = isSeries ? 'none' : '';
    seriesSelect.style.display = isSeries ? '' : 'none';
  }
  sourceType.addEventListener('change', syncSourceType);
  syncSourceType(); // sync on page load

  // Sidebar toggle
  sidebarToggle.addEventListener('click', function() {
    sidebar.classList.toggle('collapsed');
    sidebarToggle.classList.toggle('collapsed');
    sidebarToggle.innerHTML = sidebar.classList.contains('collapsed') ? '&raquo;' : '&laquo;';
  });

  // Center buttons
  centerBtn.addEventListener('click', function() {
    var s = null;
    if (selectedSat) {
      for (var i = 0; i < satPositions.length; i++) {
        if (satPositions[i].noradId == selectedSat.noradId) { s = satPositions[i]; break; }
      }
    }
    if (s) globe.pointOfView({ lat: s.lat, lng: s.lng, altitude: 2.0 }, 1000);
  });
  taiwanBtn.addEventListener('click', function() {
    globe.pointOfView({ lat: 23.5, lng: 121, altitude: 2.5 }, 1000);
  });

  // Altitude range display
  altMin.addEventListener('input', function() { altMinVal.textContent = altMin.value + ' km'; });
  altMax.addEventListener('input', function() { altMaxVal.textContent = altMax.value + ' km'; });

  // --- STATE ---
  var satellites = [];
  var selectedSat = null;
  var trackInterval = null;
  var satPositions = [];
  var currentOrbitPath = [];

  // --- API ---
  function api(path) {
    return fetch(API_BASE + path).then(function(res) {
      if (!res.ok) throw new Error('API error: ' + res.status);
      return res.json();
    });
  }

  // --- LOAD ---
  loadBtn.addEventListener('click', function() {
    loadBtn.disabled = true;
    statusBar.textContent = 'Loading...';
    satList.innerHTML = '<div class="loading">Loading satellites...</div>';

    var url = '/satellites?';
    if (sourceType.value === 'series') {
      url += 'series=' + seriesSelect.value;
    } else {
      url += 'group=' + groupSelect.value;
    }
    var search = searchInput.value.trim();
    if (search) url += '&search=' + encodeURIComponent(search);

    api(url).then(function(data) {
      satellites = data.satellites;
      statusBar.textContent = data.count + ' satellites in "' + data.group + '"';
      renderSatList();
      loadAllPositions();
    }).catch(function(err) {
      statusBar.textContent = 'Error: ' + err.message;
      satList.innerHTML = '<div class="loading">Failed to load satellites.</div>';
    }).finally(function() {
      loadBtn.disabled = false;
    });
  });

  searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') loadBtn.click(); });

  function loadAllPositions() {
    var batch = satellites.slice(0, 50);
    satPositions = [];
    globe.htmlElementsData([]);
    var minAlt = parseInt(altMin.value);
    var maxAlt = parseInt(altMax.value);
    var loaded = 0;

    batch.forEach(function(sat) {
      api('/satellites/' + sat.noradId + '/position').then(function(data) {
        var pos = data.position;
        if (pos.altitude >= minAlt && pos.altitude <= maxAlt) {
          satPositions.push({
            lat: pos.latitude,
            lng: pos.longitude,
            alt: pos.altitude,
            name: sat.name,
            noradId: sat.noradId,
            isSelected: selectedSat && selectedSat.noradId === sat.noradId,
          });
        }
      }).catch(function() {}).finally(function() {
        loaded++;
        if (loaded === batch.length) {
          globe.htmlElementsData(satPositions);
        }
      });
    });

    if (batch.length === 0) globe.htmlElementsData([]);
  }

  // Apply altitude filter
  applyFilter.addEventListener('click', function() {
    if (satellites.length > 0) loadAllPositions();
  });

  function renderSatList() {
    satList.innerHTML = '';
    satellites.forEach(function(sat) {
      var card = document.createElement('div');
      card.className = 'sat-card' + (selectedSat && selectedSat.noradId === sat.noradId ? ' active' : '');
      card.innerHTML = '<div class="name">' + sat.name + '</div><div class="meta">NORAD: ' + sat.noradId + ' | Epoch: ' + sat.epochYear + '-' + sat.epochDay.toFixed(1) + '</div>';
      card.addEventListener('click', function() { selectSat(sat); });
      satList.appendChild(card);
    });
  }

  // --- SELECT & TRACK ---
  function selectSat(sat) {
    selectedSat = sat;
    trackBtn.disabled = false;
    renderSatList();
    trackSatellite();
  }

  trackBtn.addEventListener('click', function() { if (selectedSat) trackSatellite(); });

  function trackSatellite() {
    if (!selectedSat) return;
    clearTracking();

    var id = selectedSat.noradId;
    positionPanel.style.display = 'block';
    document.getElementById('satTitle').textContent = selectedSat.name;

    // Load position (pan camera on first load only)
    updatePosition(id, true);

    // Load orbit path
    api('/satellites/' + id + '/orbit?duration=90&step=1').then(function(orbitData) {
      var pts = orbitData.path;
      currentOrbitPath = [pts.map(function(p) { return [p.latitude, p.longitude]; })];
      globe.pathsData(currentOrbitPath);
    }).catch(function() {});

    // Load passes
    passesPanel.style.display = 'block';
    api('/satellites/' + id + '/passes?hours=24').then(function(passData) {
      renderPasses(passData.passes);
    }).catch(function() {
      document.getElementById('passesList').innerHTML = '<div class="loading">Could not load passes</div>';
    });

    // Auto-refresh every 5 seconds
    trackInterval = setInterval(function() { updatePosition(id, false); }, 5000);
  }

  function updatePosition(id, shouldPan) {
    api('/satellites/' + id + '/position').then(function(data) {
      var pos = data.position;

      document.getElementById('posLat').textContent = pos.latitude.toFixed(4) + '\u00B0';
      document.getElementById('posLon').textContent = pos.longitude.toFixed(4) + '\u00B0';
      document.getElementById('posAlt').textContent = pos.altitude.toFixed(1) + ' km';
      document.getElementById('posVel').textContent = pos.velocity.toFixed(2) + ' km/s';
      document.getElementById('posTime').textContent = new Date(pos.timestamp).toLocaleTimeString();

      // Update or add the selected satellite point
      var entry = {
        lat: pos.latitude, lng: pos.longitude, alt: pos.altitude,
        name: data.name, noradId: id, isSelected: true,
      };
      var found = false;
      for (var i = 0; i < satPositions.length; i++) {
        if (satPositions[i].noradId == id) {
          satPositions[i] = entry;
          found = true;
          break;
        }
      }
      if (!found) satPositions.push(entry);
      globe.htmlElementsData(satPositions.slice());

      // Only pan camera on first track, not on auto-refresh
      if (shouldPan) {
        globe.pointOfView({ lat: pos.latitude, lng: pos.longitude, altitude: 2.0 }, 1000);
      }
    }).catch(function() {
      document.getElementById('posTime').textContent = 'Error';
    });
  }

  function renderPasses(passes) {
    var list = document.getElementById('passesList');
    if (!passes || passes.length === 0) {
      list.innerHTML = '<div class="loading">No passes in the next 24 hours</div>';
      return;
    }
    list.innerHTML = passes.map(function(p) {
      return '<div class="pass-item">' +
        '<div class="pass-time">' + new Date(p.startTime).toLocaleString('zh-TW') + ' — ' + new Date(p.endTime).toLocaleTimeString('zh-TW') + '</div>' +
        '<div class="pass-detail">' +
        'Max Elevation: ' + p.maxElevation + '° | Duration: ' + Math.floor(p.durationSeconds/60) + 'm ' + (p.durationSeconds%60) + 's<br>' +
        'Azimuth: ' + p.startAzimuth + '° → ' + p.endAzimuth + '°' +
        '</div></div>';
    }).join('');
  }

  function clearTracking() {
    if (trackInterval) { clearInterval(trackInterval); trackInterval = null; }
    currentOrbitPath = [];
    globe.pathsData([]);
    positionPanel.style.display = 'none';
    passesPanel.style.display = 'none';
  }

  // --- DAILY PASS SUMMARY ---
  var summaryIdCounter = 0;
  function renderSummarySection(label, data) {
    var html = '<div class="summary-section">';
    html += '<div class="summary-title"><span>' + label + '</span><span class="count">' + data.satellitesWithPasses + ' satellites</span></div>';
    var entries = Object.entries(data.byCountry).sort(function(a, b) { return b[1] - a[1]; });
    var details = data.detailsByCountry || {};
    entries.forEach(function(e) {
      var uid = 'sd-' + (summaryIdCounter++);
      html += '<div class="summary-country" onclick="(function(){ var l=document.getElementById(\'' + uid + '\'); var a=document.getElementById(\'a-' + uid + '\'); if(l){l.classList.toggle(\'open\'); a.classList.toggle(\'open\');} })()"><span class="sc-label"><span class="arrow" id="a-' + uid + '">&#9654;</span>' + e[0] + '</span><span class="sc-val">' + e[1] + '</span></div>';
      html += '<div class="summary-detail-list" id="' + uid + '">';
      var sats = details[e[0]] || [];
      sats.sort(function(a, b) { return b.passes - a.passes; });
      sats.forEach(function(s) {
        html += '<div class="summary-detail-item"><span class="sd-name" title="' + s.name + '">' + s.name + '</span><span class="sd-passes">' + s.passes + ' pass</span></div>';
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function loadSummary() {
    api('/satellites/pass-summary').then(function(data) {
      var html = renderSummarySection('Today (' + data.today.date + ')', data.today);
      html += '<hr class="summary-divider">';
      html += renderSummarySection('Tomorrow (' + data.tomorrow.date + ')', data.tomorrow);
      html += '<div style="font-size:0.65rem;color:#555;margin-top:4px;">Sample: ' + data.sampleSize + ' active satellites</div>';
      document.getElementById('summaryContent').innerHTML = html;
    }).catch(function() {
      document.getElementById('summaryContent').innerHTML = '<div style="font-size:0.75rem;color:#666;">Could not load summary</div>';
    });
  }

  loadSummary();
})();
</script>
</body>
</html>
